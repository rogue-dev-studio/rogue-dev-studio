name: GitHub Insights

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/insights/**"

permissions:
  contents: write
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: urmzd/github-insights@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          config-file: github-insights.yml
          sections: velocity,rhythm
          output-dir: assets/insights
          readme-path: none
          commit-push: true
          commit-message: Update GitHub Insights visualizations.
